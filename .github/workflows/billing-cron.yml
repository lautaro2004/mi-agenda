# Facturación (Nexo + Nodo): cada hora
#   1. revierte las bonificaciones vencidas (/api/cron/revert-expired-benefits)
#      — antes ningún workflow lo llamaba, así que no vencían solas;
#   2. concilia las suscripciones con Mercado Pago (/api/cron/reconcile-billing)
#      — red de seguridad de los webhooks (solo lee MP).
# Los dos son idempotentes.
#
# Requiere los mismos secrets que email-cron.yml: NEXO_APP_URL y CRON_SECRET.
# Sin ellos el workflow avisa y termina sin fallar.

name: Billing

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch: {}

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Call billing cron endpoints
        env:
          APP_URL: ${{ secrets.NEXO_APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "NEXO_APP_URL / CRON_SECRET no configurados: se omite."
            exit 0
          fi
          fail=0
          for path in revert-expired-benefits reconcile-billing; do
            status=$(curl -sS -o response.txt -w "%{http_code}" --max-time 240 -X POST \
              -H "Authorization: Bearer $CRON_SECRET" \
              "$APP_URL/api/cron/$path")
            echo "$path → HTTP $status"
            cat response.txt; echo
            if [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then fail=1; fi
          done
          exit $fail
